name: calphy-docs
channels:
  - conda-forge
dependencies:
  # Pin to 3.12: Sphinx 5.3.0 imports the stdlib `imghdr` module, which was
  # removed in Python 3.13 (PEP 594).  An unpinned `python` resolves to 3.13+
  # and breaks the docs build with "No module named 'imghdr'".
  - python=3.12
  - pytest
  - scipy
  - pyyaml
  - mendeleev
  - numpy
  - ase
  - matplotlib
  - tqdm
  - pydantic >=2.3.0
  # pandoc is required by nbsphinx to render the example notebooks.  Read the
  # Docs ships it in the build image, but the GitHub Actions runner does not,
  # so it must be declared here explicitly.
  - pandoc
  # pyscal3 4.x (the pyscal 4 API) is on PyPI but not yet on conda-forge;
  # move it back to the conda list once the feedstock has 4.0.0.
  - pip:
    - pyscal3>=4.0.0
    - sphinx==5.3.0
    - sphinx_rtd_theme
    - myst_parser
    - furo
    - nbsphinx
    - sphinx_inline_tabs
    - sphinx_copybutton
    - sphinx_design
    - docutils==0.19
