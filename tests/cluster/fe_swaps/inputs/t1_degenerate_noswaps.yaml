# T1: degenerate binary without swaps: reference run for T1.
# Expect F(swaps) - F(noswaps) = kT ln(1/2) = -0.029865 eV/atom at 500 K.
calculations:
- element: [Cu, Ni]
  mass: [63.546, 63.546]
  lattice: ../cu2.data
  lattice_constant: 0.0
  mode: fe
  reference_phase: solid
  temperature: 500.0
  pressure: 0.0
  pair_style: eam/alloy
  pair_coeff: '* * ../cu2.eam.alloy Cu Ni'
  lammps_executable: /path/to/thermoatoms/lammps/build/lmp
  spring_constants: [2.15, 2.15]
  md:
    timestep: 0.001
    n_small_steps: 2000
  n_equilibration_steps: 25000
  n_switching_steps: 50000
  n_iterations: 5
  queue:
    scheduler: local
    cores: 8
