# T1: degenerate binary (fcc Cu, half of the atoms labelled type 2, identical EAM
# functions for both, equal masses), with swaps.  Expect F = F(noswaps) + kT ln(1/2).
calculations:
- element: [Cu, Ni]
  mass: [63.546, 63.546]
  lattice: ../cu2.data
  lattice_constant: 0.0
  mode: fe
  reference_phase: solid
  temperature: 500.0
  pressure: 0.0
  pair_style: eam/alloy
  pair_coeff: '* * ../cu2.eam.alloy Cu Ni'
  lammps_executable: /path/to/thermoatoms/lammps/build/lmp
  monte_carlo:
    n_steps: 10
    n_swaps: 10
    use_custom_lammps: true
  spring_constants: [2.15, 2.15]
  md:
    timestep: 0.001
    n_small_steps: 2000
  n_equilibration_steps: 25000
  n_switching_steps: 50000
  n_iterations: 5
  queue:
    scheduler: local
    cores: 8
