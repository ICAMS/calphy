# T2: ordered B2 CuZr (Mendelev EAM), 800 K, without swaps: reference run for T2.
# F(swaps) - F(noswaps) should be small compared with kT ln(1/2) if the B2 order persists.
calculations:
- element: [Zr, Cu]
  mass: [91.224, 63.546]
  lattice: ../../../../examples/example_10/ZrCu.data
  lattice_constant: 0.0
  mode: fe
  reference_phase: solid
  temperature: 800.0
  pressure: 0.0
  equilibration_control: berendsen
  pair_style: eam/fs
  pair_coeff: '* * ../../../../examples/potentials/ZrCu.eam.fs Zr Cu'
  lammps_executable: /path/to/thermoatoms/lammps/build/lmp
  n_print_steps: 1000
  md:
    timestep: 0.001
    n_small_steps: 2000
    n_cycles: 200
  n_equilibration_steps: 25000
  n_switching_steps: 100000
  n_iterations: 3
  queue:
    scheduler: local
    cores: 8
