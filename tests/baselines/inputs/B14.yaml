# B14 — fe / solid with monte_carlo swaps — B2 ZrCu (512/512), 800 K, 0 bar, ZrCu EAM (eam/fs);
#        Frenkel-Ladd switching with species swaps between lattice sites (configurational
#        equilibration in the averaging stage, swaps at T/(1-lambda) along both legs).
#        Needs the thermoatoms LAMMPS fork (equal-style swap temperature).
calculations:
- element: [Zr, Cu]
  mass: [91.224, 63.546]
  lattice: examples/example_10/ZrCu.data
  lattice_constant: 0.0
  mode: fe
  reference_phase: solid
  temperature: 800.0
  pressure: 0.0
  equilibration_control: berendsen
  pair_style: eam/fs
  pair_coeff: '* * examples/potentials/ZrCu.eam.fs Zr Cu'
  monte_carlo:
    n_steps: 10
    n_swaps: 5
    use_custom_lammps: true
  md:
    timestep: 0.001
    n_small_steps: 1000
  n_equilibration_steps: 2500
  n_switching_steps: 5000
  n_iterations: 1
  spring_constants: null
  queue:
    scheduler: local
    cores: 4
